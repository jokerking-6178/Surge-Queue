name: Build, Push, and Deploy

on:
  push:
    branches: [main]
    paths:
      - "queue-engine/**"
      - "backend/**"
      - "loadtest/**"
      - "infra/**"
      - "deploy/**"
  pull_request:
    branches: [main]

env:
  OCI_REGION: ap-mumbai-1

jobs:
  # ============================================================
  # Build & push Docker images to OCI Container Registry
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: queue-engine
            context: ./queue-engine
          - service: backend
            context: ./backend
          - service: loadtest
            context: ./loadtest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to OCI Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION }}.ocir.io
          username: ${{ secrets.OCI_TENANCY_NAMESPACE }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/surge/${{ matrix.service }}:latest
            ${{ env.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/surge/${{ matrix.service }}:${{ steps.tag.outputs.tag }}

  # ============================================================
  # Terraform plan (on PR) / apply (on push to main)
  # ============================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Write tfvars
        run: |
          cat > terraform.tfvars << EOF
          tenancy_ocid     = "${{ secrets.OCI_TENANCY_OCID }}"
          user_ocid        = "${{ secrets.OCI_USER_OCID }}"
          fingerprint      = "${{ secrets.OCI_FINGERPRINT }}"
          private_key_path = "oci_api_key.pem"
          region           = "ap-mumbai-1"
          compartment_ocid = "${{ secrets.OCI_COMPARTMENT_OCID }}"
          EOF
          echo "${{ secrets.OCI_API_KEY }}" | base64 -d > oci_api_key.pem
          chmod 600 oci_api_key.pem

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

  # ============================================================
  # Deploy to OKE
  # ============================================================
  deploy:
    name: Deploy to OKE
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_API_KEY }}" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config

      - name: Get OKE kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OKE_CLUSTER_OCID }} \
            --file $HOME/.kube/config \
            --region ap-mumbai-1 \
            --token-version 2.0.0

      - name: Update image tags in manifests
        run: |
          TAG=${GITHUB_SHA::7}
          sed -i "s|surge/queue-engine:latest|${{ env.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/surge/queue-engine:$TAG|g" deploy/base/queue-engine.yaml
          sed -i "s|surge/backend:latest|${{ env.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/surge/backend:$TAG|g" deploy/base/backend.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/base/namespace.yaml
          kubectl apply -f deploy/base/secret-externalsecret.yaml
          kubectl apply -f deploy/base/redis.yaml
          kubectl apply -f deploy/base/queue-engine.yaml
          kubectl apply -f deploy/base/backend.yaml
          kubectl apply -f deploy/base/networkpolicy.yaml
          kubectl apply -f deploy/base/ingress.yaml || true

      - name: Wait for rollout
        run: |
          kubectl -n surge-system rollout status deployment/queue-engine --timeout=300s
          kubectl -n surge-system rollout status deployment/backend --timeout=300s
