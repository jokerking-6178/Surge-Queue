name: CI with Kind

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test on Kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: queue-engine/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: surge-queue
          config: .github/kind-config.yaml

      - name: Build queue-engine image
        run: |
          docker build -t queue-engine:local ./queue-engine
          kind load docker-image queue-engine:local --name surge-queue

      - name: Build backend image
        run: |
          docker build -t backend:local ./backend
          kind load docker-image backend:local --name surge-queue

      - name: Build frontend image
        run: |
          docker build -t frontend:local ./frontend
          kind load docker-image frontend:local --name surge-queue

      - name: Create JWT secret
        run: |
          kubectl create namespace surge-system || true
          kubectl create secret generic jwt-secret -n surge-system --from-literal=JWT_SECRET="test-secret-for-ci" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/queue-engine.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml

      - name: Wait for deployments
        run: |
          kubectl wait --for=condition=available -n surge-system deployment/redis --timeout=60s
          kubectl wait --for=condition=available -n surge-system deployment/queue-engine --timeout=60s
          kubectl wait --for=condition=available -n surge-system deployment/backend --timeout=300s
          kubectl wait --for=condition=available -n surge-system deployment/frontend --timeout=60s

      - name: Check pod status
        run: kubectl get pods -n surge-system

      - name: Test queue-engine health
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://queue-engine:80/healthz -n surge-system

      - name: Test backend health
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f http://backend:80/actuator/health -n surge-system

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== All pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Pod details in surge-system ==="
          kubectl describe pods -n surge-system
          echo ""
          echo "=== Redis logs ==="
          kubectl logs --tail=50 -n surge-system deployment/redis
          echo ""
          echo "=== Queue-engine logs ==="
          kubectl logs --tail=50 -n surge-system deployment/queue-engine
          echo ""
          echo "=== Backend logs ==="
          kubectl logs --tail=50 -n surge-system deployment/backend
          echo ""
          echo "=== Frontend logs ==="
          kubectl logs --tail=50 -n surge-system deployment/frontend
          echo ""
          echo "=== Events in surge-system ==="
          kubectl get events -n surge-system --sort-by=.lastTimestamp
