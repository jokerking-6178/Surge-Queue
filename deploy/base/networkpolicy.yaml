# Network Policies — restrict pod-to-pod communication to only what's needed.
# This is defense-in-depth: even if someone gets into the cluster, they can't
# reach the backend or Redis unless they're in the queue-engine pod.
---
# Default deny all ingress in surge-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: surge-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress controller → queue-engine
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-queue
  namespace: surge-system
spec:
  podSelector:
    matchLabels:
      app: queue-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Allow ingress controller → backend (but backend also enforces JWT check)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: surge-system
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: queue-engine
      ports:
        - protocol: TCP
          port: 8081
---
# Allow queue-engine → Redis only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-queue-to-redis
  namespace: surge-system
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: queue-engine
      ports:
        - protocol: TCP
          port: 6379
---
# Allow Prometheus → all pods for scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: surge-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: surge-monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
