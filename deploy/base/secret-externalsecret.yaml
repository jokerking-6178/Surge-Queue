# ExternalSecret — syncs the JWT secret from OCI Vault into a K8s Secret.
# Requires External Secrets Operator to be installed:
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# Also requires a SecretStore configured with OCI Vault credentials.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault-store
  namespace: surge-system
spec:
  provider:
    oci:
      # The OCI Vault OCID from Terraform output
      vault: "ocid1.vault.oc1.ap-mumbai-1...." # replace with actual vault OCID
      auth:
        # Uses instance principal (workload identity) — OKE nodes must have
        # permission to read secrets from the vault via IAM policy.
        instancePrincipal:
          serviceAccount: surge-secret-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: surge-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: "surge-queue-jwt-secret"
        property: content
---
# The synced secret — DO NOT create manually in prod.
# For local dev (without Vault), uncomment and use this instead:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: jwt-secret
#   namespace: surge-system
# type: Opaque
# stringData:
#   JWT_SECRET: "dev-secret-change-me"
