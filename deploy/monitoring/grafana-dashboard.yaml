# Grafana dashboard ConfigMap — surge queue monitoring dashboard.
# Shows queue depth, admission rate, wait times, and backend health.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: surge-grafana-dashboards
  namespace: surge-monitoring
  labels:
    grafana_dashboard: "1"
data:
  surge-queue.json: |
    {
      "dashboard": {
        "title": "Surge Queue System",
        "tags": ["surge", "queue"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Queue Depth (waiting users)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
            "targets": [{"expr": "surge_queue_depth", "legendFormat": "waiting"}]
          },
          {
            "title": "Admitted (active sessions)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
            "targets": [{"expr": "surge_queue_admitted_active", "legendFormat": "active"}]
          },
          {
            "title": "Queue Depth Over Time",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {"expr": "surge_queue_depth", "legendFormat": "waiting"},
              {"expr": "surge_queue_admitted_active", "legendFormat": "admitted"}
            ]
          },
          {
            "title": "Admission Rate (per 5m)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [{"expr": "rate(surge_queue_admitted_total[5m])", "legendFormat": "admitted/s"}]
          },
          {
            "title": "Wait Time Distribution (seconds)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {"expr": "histogram_quantile(0.5, rate(surge_queue_wait_time_seconds_bucket[5m]))", "legendFormat": "p50"},
              {"expr": "histogram_quantile(0.95, rate(surge_queue_wait_time_seconds_bucket[5m]))", "legendFormat": "p95"},
              {"expr": "histogram_quantile(0.99, rate(surge_queue_wait_time_seconds_bucket[5m]))", "legendFormat": "p99"}
            ]
          },
          {
            "title": "Backend Registrations (total)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16},
            "targets": [{"expr": "surge_backend_registrations_total", "legendFormat": "total"}]
          },
          {
            "title": "Backend HTTP Latency",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 16},
            "targets": [
              {"expr": "histogram_quantile(0.5, rate(surge_queue_http_request_duration_seconds_bucket[5m]))", "legendFormat": "p50"},
              {"expr": "histogram_quantile(0.99, rate(surge_queue_http_request_duration_seconds_bucket[5m]))", "legendFormat": "p99"}
            ]
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "10s"
      }
    }
