# Monitoring — Prometheus + Grafana via kube-prometheus-stack helm values.
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n surge-monitoring --create-namespace \
#     -f deploy/monitoring/values.yaml
#
# The values below configure scraping for our services and expose Grafana.
---
# ServiceMonitor for the queue engine — tells Prometheus to scrape /metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: queue-engine-monitor
  namespace: surge-system
  labels:
    release: kube-prometheus-stack # must match the helm release name
spec:
  selector:
    matchLabels:
      app: queue-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: surge-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
