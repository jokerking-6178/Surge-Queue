# Helm values for kube-prometheus-stack
# Usage:
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n surge-monitoring --create-namespace -f deploy/monitoring/values.yaml

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

grafana:
  enabled: true
  adminPassword: "surge-admin" # change in production
  service:
    type: LoadBalancer
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'surge'
          orgId: 1
          folder: 'Surge Queue'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/surge
  dashboardsConfigMaps:
    surge: surge-grafana-dashboards

alertmanager:
  enabled: true
  config:
    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'default'
    receivers:
      - name: 'default'
        # Add Slack webhook here for alerts
        webhook_configs:
          - url: 'http://backend.surge-system:80/api/health'
            send_resolved: true
