apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-engine
  namespace: surge-system
  labels:
    app: queue-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-engine
  template:
    metadata:
      labels:
        app: queue-engine
    spec:
      containers:
        - name: queue-engine
          image: queue-engine:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: ADMIT_RATE_PER_SEC
              value: "25"
            - name: MAX_CONCURRENT_ADMITTED
              value: "200"
            - name: ADMITTED_SESSION_TTL
              value: "300"
            - name: WAITING_TTL
              value: "600"
            - name: JWT_TTL
              value: "600"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: queue-engine
  namespace: surge-system
spec:
  selector:
    app: queue-engine
  ports:
    - port: 80
      targetPort: 8080
      name: http
